<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skyline Agent</title>
<style>
  :root {
    --bg: #0e1414;
    --panel: #151c1c;
    --line: #26312f;
    --text: #e8ede9;
    --muted: #7f9490;
    --accent: #4fd1a5;
    --accent-dim: #2a5c4a;
    --user-bubble: #1f2b28;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 18px 24px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  header .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }
  header h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0;
  }
  header span {
    color: var(--muted);
    font-size: 12px;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }
  .msg {
    padding: 12px 16px;
    border-radius: 10px;
    line-height: 1.5;
    font-size: 14.5px;
    max-width: 80%;
    white-space: pre-wrap;
  }
  .user {
    align-self: flex-end;
    background: var(--user-bubble);
    border: 1px solid var(--line);
  }
  .agent {
    align-self: flex-start;
    background: var(--panel);
    border: 1px solid var(--accent-dim);
  }
  .agent.loading {
    color: var(--muted);
    font-style: italic;
  }
  form {
    display: flex;
    gap: 10px;
    padding: 18px 24px;
    border-top: 1px solid var(--line);
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }
  input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 14.5px;
    outline: none;
  }
  input:focus {
    border-color: var(--accent);
  }
  button {
    background: var(--accent);
    color: #06231a;
    border: none;
    padding: 0 20px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
</style>
</head>
<body>

<header>
  <div class="dot"></div>
  <h1>Skyline Agent</h1>
  <span>local · gemini-flash-latest</span>
</header>

<div id="chat"></div>

<form id="chat-form">
  <input id="input" type="text" placeholder="Ask something..." autocomplete="off" />
  <button type="submit">Send</button>
</form>

<script>
  const chat = document.getElementById("chat");
  const form = document.getElementById("chat-form");
  const input = document.getElementById("input");

  function addMessage(text, role) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, "user");
    input.value = "";
    input.disabled = true;

    const loadingEl = addMessage("Thinking...", "agent loading");

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text }),
      });
      const data = await res.json();
      loadingEl.classList.remove("loading");
      loadingEl.textContent = data.reply || data.error || "No response.";
    } catch (err) {
      loadingEl.classList.remove("loading");
      loadingEl.textContent = "Couldn't reach the server. Is it still running?";
    }

    input.disabled = false;
    input.focus();
  });
</script>

</body>
</html>
