<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Log in - MainAI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root {
    --canopy: #0f1f16;
    --canopy-deep: #0a1610;
    --bark: #4a3728;
    --bark-light: #6b5240;
    --moss: #4f7942;
    --moss-bright: #6fa459;
    --moss-dim: rgba(111,164,89,0.16);
    --fern: #2e5233;
    --amber: #e8b84b;
    --amber-dim: rgba(232,184,75,0.15);
    --cream: #f4ede0;
    --cream-soft: #cfc4ae;
    --line: #2a3f2c;
    --danger: #e0705c;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background:
      radial-gradient(1000px 500px at 15% -10%, rgba(232,184,75,0.10), transparent 55%),
      radial-gradient(800px 500px at 85% 100%, rgba(79,121,66,0.20), transparent 60%),
      linear-gradient(180deg, var(--canopy) 0%, var(--canopy-deep) 100%);
    color: var(--cream);
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }

  /* Soft leaf-shaped shapes drifting in the background */
  body::before, body::after {
    content: "";
    position: absolute;
    border-radius: 50% 0 50% 50%;
    opacity: 0.12;
    filter: blur(2px);
  }
  body::before {
    width: 260px; height: 260px;
    background: var(--moss-bright);
    top: -60px; left: -60px;
    transform: rotate(25deg);
  }
  body::after {
    width: 200px; height: 200px;
    background: var(--amber);
    bottom: -50px; right: -40px;
    transform: rotate(-35deg);
  }

  .card {
    position: relative;
    background: rgba(20, 35, 24, 0.85);
    backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 36px 32px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.4);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 22px;
  }

  .logo-mark {
    width: 42px; height: 42px;
    border-radius: 50% 0 50% 50%;
    background: linear-gradient(135deg, var(--moss-bright), var(--fern));
    display: flex; align-items: center; justify-content: center;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 19px;
    color: var(--canopy-deep);
    flex-shrink: 0;
    box-shadow: 0 3px 12px rgba(79,121,66,0.45);
  }

  h1 {
    font-family: 'Baloo 2', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--cream);
  }

  p.sub {
    color: var(--cream-soft);
    font-size: 14px;
    margin-bottom: 26px;
    line-height: 1.5;
  }

  label {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--moss-bright);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    display: block;
    margin-bottom: 6px;
  }

  input {
    width: 100%;
    background: rgba(10, 22, 16, 0.6);
    border: 1.5px solid var(--line);
    color: var(--cream);
    padding: 12px 14px;
    border-radius: 12px;
    font-family: 'Nunito', sans-serif;
    font-size: 14.5px;
    font-weight: 500;
    margin-bottom: 18px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input::placeholder { color: var(--cream-soft); opacity: 0.5; }
  input:focus {
    border-color: var(--moss-bright);
    box-shadow: 0 0 0 3px var(--moss-dim);
  }

  button {
    width: 100%;
    border: none;
    padding: 13px;
    border-radius: 14px;
    font-weight: 700;
    font-size: 14.5px;
    cursor: pointer;
    font-family: 'Baloo 2', sans-serif;
    margin-bottom: 10px;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  button:active { transform: scale(0.97); }

  #login-btn {
    background: linear-gradient(135deg, var(--moss-bright), var(--fern));
    color: #f5fff2;
    box-shadow: 0 4px 14px rgba(79,121,66,0.35);
  }
  #login-btn:hover { box-shadow: 0 6px 18px rgba(79,121,66,0.45); transform: translateY(-1px); }

  #signup-btn {
    background: transparent;
    color: var(--amber);
    border: 1.5px solid var(--amber);
  }
  #signup-btn:hover { background: var(--amber-dim); }

  #status {
    font-size: 13px;
    color: var(--cream-soft);
    min-height: 18px;
    margin-top: 10px;
    text-align: center;
    font-weight: 600;
    line-height: 1.5;
  }
  #status.error { color: var(--danger); }
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="logo-mark">M</div>
    <h1>MainAI</h1>
  </div>
  <p class="sub">Karibu - sign in or create an account to keep chatting where you left off.</p>

  <label for="email">Email</label>
  <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />

  <label for="password">Password</label>
  <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />

  <button id="login-btn">Log in</button>
  <button id="signup-btn">Create account</button>

  <div id="status"></div>
</div>

<script>
  const SUPABASE_URL = "https://nnbnvjbijoxazjugombn.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_C9XGdAGhv4FOgpyCzhZbsw_DcCTot6U";
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const statusEl = document.getElementById("status");

  function showStatus(msg, isError = false) {
    statusEl.textContent = msg;
    statusEl.className = isError ? "error" : "";
  }

  client.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = "/index.html";
  });

  document.getElementById("login-btn").addEventListener("click", async () => {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    showStatus("Logging in...");
    const { error } = await client.auth.signInWithPassword({ email, password });
    if (error) return showStatus(error.message, true);
    window.location.href = "/index.html";
  });

  document.getElementById("signup-btn").addEventListener("click", async () => {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    showStatus("Creating account...");
    const { error } = await client.auth.signUp({ email, password });
    if (error) return showStatus(error.message, true);
    showStatus("Account created! Check your email if confirmation is required, then log in.");
  });
</script>

</body>
</html>
