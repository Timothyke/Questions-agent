<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Skyline Agent</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0e1414;
    --panel: #151c1c;
    --line: #26312f;
    --text: #e8ede9;
    --muted: #7f9490;
    --accent: #4fd1a5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 32px;
    width: 100%;
    max-width: 360px;
  }
  h1 {
    font-size: 18px;
    margin: 0 0 4px;
  }
  p.sub {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 24px;
  }
  label {
    font-size: 13px;
    color: var(--muted);
    display: block;
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    background: #0e1414;
    border: 1px solid var(--line);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 16px;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    width: 100%;
    background: var(--accent);
    color: #06231a;
    border: none;
    padding: 11px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    margin-bottom: 10px;
  }
  button.secondary {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  #status {
    font-size: 13px;
    color: var(--muted);
    min-height: 18px;
    margin-top: 8px;
  }
  #status.error { color: #e07a7a; }
</style>
</head>
<body>

<div class="card">
  <h1>Skyline Agent</h1>
  <p class="sub">Sign in or create an account</p>

  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="email" />

  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password" />

  <button id="login-btn">Log in</button>
  <button id="signup-btn" class="secondary">Create account</button>

  <div id="status"></div>
</div>

<script>
  const SUPABASE_URL = "https://nnbnvjbijoxazjugombn.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_C9XGdAGhv4FOgpyCzhZbsw_DcCTot6U";
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const statusEl = document.getElementById("status");

  function showStatus(msg, isError = false) {
    statusEl.textContent = msg;
    statusEl.className = isError ? "error" : "";
  }

  // If already logged in, skip straight to the chat
  client.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = "/index.html";
  });

  document.getElementById("login-btn").addEventListener("click", async () => {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    showStatus("Logging in...");
    const { error } = await client.auth.signInWithPassword({ email, password });
    if (error) return showStatus(error.message, true);
    window.location.href = "/index.html";
  });

  document.getElementById("signup-btn").addEventListener("click", async () => {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    showStatus("Creating account...");
    const { error } = await client.auth.signUp({ email, password });
    if (error) return showStatus(error.message, true);
    showStatus("Account created! Check your email if confirmation is required, then log in.");
  });
</script>

</body>
</html>
